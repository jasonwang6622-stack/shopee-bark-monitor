name: Shopee Restock to Bark

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '先 diagnose，再 test-push，最後 check'
        type: choice
        default: diagnose
        options:
          - diagnose
          - test-push
          - check

permissions:
  contents: write

concurrency:
  group: shopee-bark-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest test_monitor.py

      - name: Check stock or test Bark
        shell: bash
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          RUN_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: |
          if [[ "$RUN_MODE" != 'diagnose' ]]; then
            if [[ -z "$BARK_KEY" ]]; then
              echo 'GitHub Secret BARK_KEY 尚未設定'
              exit 1
            fi
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('config.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          cfg['bark_key'] = os.environ['BARK_KEY']
          path.write_text(json.dumps(cfg, ensure_ascii=False), encoding='utf-8')
          PY
          fi
          case "$RUN_MODE" in
            diagnose)  python monitor.py --diagnose ;;
            test-push) python monitor.py --test-push ;;
            check)     python monitor.py --once ;;
            *) echo 'Unknown mode'; exit 2 ;;
          esac

      - name: Save stock state
        if: ${{ success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'check') }}
        shell: bash
        run: |
          if [[ ! -f state.json ]]; then
            echo '沒有可保存的庫存狀態。請檢查 diagnose 的讀取結果。'
            exit 0
          fi
          git add -- state.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: save stock status [skip ci]'
            git push
          fi
